  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    //vvv
    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der-radius:18px;background:linear-gradient(150deg,rgba(169,119,11,0.07) 0%,rgba(169,119,11,0.15) 100%);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z\" stroke=\"#A9770B\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M18 16.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9z\" stroke=\"#A9770B\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;line-height:1.35\">Strategy before polish<\u002Fspan>\n          <\u002Fdiv>\n          <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:22px;padding:26px;border-radius:18px;background:linear-gradient(150deg,rgba(169,119,11,0.07) 0%,rgba(169,119,11,0.15) 100%);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#A9770B\" stroke-width=\"1.5\"><\u002Frect><path d=\"M9 10l-2 2 2 2M15 10l2 2-2 2\" stroke=\"#A9770B\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;line-height:1.35\">Ship, then sharpen<\u002Fspan>\n          <\u002Fdiv>\n          <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:22px;padding:26px;border-radius:18px;background:linear-gradient(150deg,rgba(169,119,11,0.13) 0%,rgba(169,119,11,0.05) 100%);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 13l3.5-2.5L10 13l2.5-2 3 2.4L21 10\" stroke=\"#A9770B\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M3 17h18\" stroke=\"#A9770B\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;line-height:1.35\">Evidence over opinion<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Design process\" style=\"padding:100px 40px 120px;background:linear-gradient(180deg,rgba(169,119,11,0.05) 0%,rgba(169,119,11,0.02) 100%)\">\n      <h2 data-reveal=\"1\" style=\"margin:0 auto;max-width:1240px;text-align:center;font-family:'Outfit',sans-serif;font-weight:500;font-size:46px;letter-spacing:-0.02em;transition:opacity .8s ease,transform .8s ease\">My design process<\u002Fh2>\n\n      <div style=\"max-width:1000px;margin:64px auto 0;display:flex;flex-direction:column;gap:8px\">\n        <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n            <svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\" stroke=\"#A9770B\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M15.4 15.4L21 21\" stroke=\"#A9770B\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"flex:1;width:2px;min-height:52px;background:linear-gradient(180deg,rgba(169,119,11,0.5),rgba(169,119,11,0.06))\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-bottom:38px\">\n            <h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:23px;font-weight:600;letter-spacing:-0.01em\">Frame the real problem<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.72;color:#4A5360\">Most briefs arrive as a solution someone has already picked. My first job is to walk it back to the problem — reading the analytics, sitting in on support calls, and asking the team what they are each optimising for, because the answers rarely match. I come out of it with a written problem statement and a definition of what a win looks like. Nothing gets designed until both are agreed.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n            <svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 12l4-3 5 4 5-4 4 3\" stroke=\"#A9770B\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M3 16l4-3 5 4 5-4 4 3\" stroke=\"#A9770B\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"flex:1;width:2px;min-height:52px;background:linear-gradient(180deg,rgba(169,119,11,0.5),rgba(169,119,11,0.06))\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-bottom:38px\">\n            <h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:23px;font-weight:600;letter-spacing:-0.01em\">Design in the open<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.72;color:#4A5360\">I design in the open, in small increments, with engineering in the room early. Screens get annotated with the constraint or insight that drove them, and files are structured so anyone can find the current state without asking me. Rough work goes up before it is pretty — a flow that is wrong is far cheaper to catch as a wireframe than as a polished mock.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:64px 1fr;gap:26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n            <svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M10 3h4M11 3v6.2L6.6 18a2 2 0 001.8 3h7.2a2 2 0 001.8-3L13 9.2V3\" stroke=\"#A9770B\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:23px;font-weight:600;letter-spacing:-0.01em\">Measure and revise<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.72;color:#4A5360\">Handoff is a checkpoint, not the finish line. I instrument the flows I design, watch what real usage does to the assumptions behind them, and QA the build against the spec before it ships. When the numbers disagree with the design, the design changes — and what we learned goes into the brief for the next round rather than into a slide nobody reopens.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"References\" style=\"padding:130px 40px 140px;background:linear-gradient(180deg,rgba(169,119,11,0.015) 0%,rgba(169,119,11,0.06) 55%,#ffffff 100%)\">\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n        <span style=\"display:flex;align-items:center;gap:9px;padding:9px 20px;border-radius:999px;background:rgba(255,255,255,0.8);font-size:12px;font-weight:500;letter-spacing:0.14em;color:#3E4652\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M7 11V6a2 2 0 114 0v5h4.5a2 2 0 011.9 2.6l-1.5 5A2 2 0 0114 20H8a2 2 0 01-2-2v-7\" stroke=\"#16181D\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          REFERENCES\n        <\u002Fspan>\n        <h2 style=\"margin:0;max-width:900px;font-family:'Outfit',sans-serif;font-weight:600;font-size:44px;line-height:1.22;letter-spacing:-0.02em;text-align:center;text-wrap:pretty\">Don't take it from me — hear it from my managers &amp; peers<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"max-width:1240px;margin:64px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:28px\">\n        <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:24px;padding:34px;border-radius:22px;background:rgba(255,255,255,0.66);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <p style=\"margin:0;font-size:15px;line-height:1.7;color:#3E4652\">\"Placeholder recommendation — replace with a real quote. Sindhu is a meticulous designer with a deep understanding of both craft and code, which lets her collaborate closely with engineers and ship work that holds up in production.\"<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:14px;font-weight:700;color:#16181D\">Reference name<\u002Fspan>\n            <span style=\"font-size:12px;color:#A9770B\">Sr. UX Design Manager @ Company<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:24px;padding:34px;border-radius:22px;background:rgba(255,255,255,0.66);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <p style=\"margin:0;font-size:15px;line-height:1.7;color:#3E4652\">\"Placeholder recommendation — replace with a real quote. Her attention to detail and ability to deliver clear, high-quality designs under tight deadlines is remarkable, and she consistently takes ownership of her work.\"<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:14px;font-weight:700;color:#16181D\">Reference name<\u002Fspan>\n            <span style=\"font-size:12px;color:#A9770B\">Director, Product Design @ Company<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:24px;padding:34px;border-radius:22px;background:rgba(255,255,255,0.66);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <p style=\"margin:0;font-size:15px;line-height:1.7;color:#3E4652\">\"Placeholder recommendation — replace with a real quote. She balances user needs and business objectives, and takes a high degree of ownership on every project she is assigned.\"<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:14px;font-weight:700;color:#16181D\">Reference name<\u002Fspan>\n            <span style=\"font-size:12px;color:#A9770B\">Product Manager @ Company<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:24px;padding:34px;border-radius:22px;background:rgba(255,255,255,0.66);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)\">\n          <p style=\"margin:0;font-size:15px;line-height:1.7;color:#3E4652\">\"Placeholder recommendation — replace with a real quote. A rare mix of design talent and tenacity — she showed the team what it means to be both a designer and a great teammate.\"<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:14px;font-weight:700;color:#16181D\">Reference name<\u002Fspan>\n            <span style=\"font-size:12px;color:#A9770B\">User Experience Director @ Company<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display:flex;justify-content:center;margin-top:56px;transition:opacity .7s ease,transform .7s ease\">\n        <a href=\"#0\" style=\"display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;border:1px solid #16181D;color:#16181D;font-size:12px;font-weight:700;letter-spacing:0.12em;white-space:nowrap\" style-hover=\"background:#16181D;color:#ffffff\">MORE ON LINKEDIN\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12h13M13 6l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"FAQs\" style=\"padding:20px 40px 140px;background:#ffffff\">\n      <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start\">\n        <h2 data-reveal=\"1\" style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:500;font-size:46px;letter-spacing:-0.02em;flex:0 1 240px;transition:opacity .8s ease,transform .8s ease\">FAQs<\u002Fh2>\n        <div data-reveal=\"1\" style=\"flex:1 1 480px;display:flex;flex-direction:column;transition:opacity .8s ease,transform .8s ease\">\n          <sc-for list=\"{{ homeFaqs }}\" as=\"item\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom:1px solid rgba(169,119,11,0.22)\">\n              <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 4px;cursor:pointer\" style-hover=\"color:#A9770B\">\n                <span style=\"font-size:16px;font-weight:500;line-height:1.45\">{{ item.q }}<\u002Fspan>\n                <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none;transform:{{ item.caret }};transition:transform .35s cubic-bezier(.2,.7,.2,1)\"><path d=\"M6 9.5l6 6 6-6\" stroke=\"#A9770B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0;padding:0 60px 26px 4px;font-size:15px;line-height:1.72;color:#4A5360\">{{ item.a }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isServices }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <section data-screen-label=\"Services hero\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:190px 40px 120px;overflow:hidden;background:linear-gradient(170deg,#ffffff 0%,rgba(169,119,11,0.06) 55%,rgba(169,119,11,0.02) 100%)\">\n      <div style=\"position:absolute;top:-20%;right:-12%;width:65%;height:90%;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(240,214,140,0.45),rgba(240,214,140,0) 70%);animation:sb-drift 26s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n      <h1 style=\"position:relative;margin:0;max-width:16ch;text-align:center;font-family:'Outfit',sans-serif;font-weight:400;font-size:62px;line-height:1.14;letter-spacing:-0.02em;text-wrap:pretty\">Senior product design, scoped to what you actually need.<\u002Fh1>\n      <p style=\"position:relative;margin:0;max-width:52ch;text-align:center;font-size:16px;line-height:1.65;color:#4A5360\">Whether the product is live and underperforming or still a sketch, I can help you find the real problem and design your way out of it. Tell me what you're working on.<\u002Fp>\n      <div style=\"position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:10px\">\n        <a href=\"mailto:sindhu.bayagari@gmail.com\" style=\"display:inline-flex;align-items:center;padding:16px 30px;border-radius:999px;background:#A9770B;color:#ffffff;font-size:12px;font-weight:700;letter-spacing:0.12em;white-space:nowrap\" style-hover=\"background:#855D07;color:#ffffff\">BOOK A FREE DISCOVERY CALL<\u002Fa>\n        <span sc-camel-on-click=\"{{ goPackages }}\" style=\"display:inline-flex;align-items:center;padding:16px 30px;border-radius:999px;border:1px solid #16181D;font-size:12px;font-weight:700;letter-spacing:0.12em;white-space:nowrap;cursor:pointer\" style-hover=\"background:#16181D;color:#ffffff\">VIEW PACKAGES<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Core services\" style=\"padding:20px 40px 110px;background:linear-gradient(180deg,rgba(169,119,11,0.02) 0%,rgba(169,119,11,0.06) 100%)\">\n      <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start\">\n        <h2 data-reveal=\"1\" style=\"margin:0;font-family:'Outfit',sans-serif;font-weight:500;font-size:44px;line-height:1.12;letter-spacing:-0.02em;flex:0 1 300px;transition:opacity .8s ease,transform .8s ease\">What I can help with<\u002Fh2>\n        <div style=\"flex:1 1 480px;display:flex;flex-direction:column;gap:34px\">\n          <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:14px;transition:opacity .8s ease,transform .8s ease\">\n            <span style=\"font-size:16px;color:#3E4652\"><strong style=\"font-weight:700;color:#16181D\">Find out what's wrong<\u002Fstrong><\u002Fspan>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.6;color:#4A5360\">\n              <li>Usability review — pinpoint where people stall, hesitate, or drop out.<\u002Fli>\n              <li>User research — talk to the people who actually use the product.<\u002Fli>\n              <li>Analytics review — read the behaviour behind the numbers.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:14px;transition:opacity .8s ease,transform .8s ease\">\n            <span style=\"font-size:16px;color:#3E4652\"><strong style=\"font-weight:700;color:#16181D\">Design the answer<\u002Fstrong><\u002Fspan>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.6;color:#4A5360\">\n              <li>End-to-end product design for web and mobile.<\u002Fli>\n              <li>Design systems that keep teams fast and consistent.<\u002Fli>\n              <li>Prototypes your team can test before a line of code is written.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:14px;transition:opacity .8s ease,transform .8s ease\">\n            <span style=\"font-size:16px;color:#3E4652\"><strong style=\"font-weight:700;color:#16181D\">Prove it worked<\u002Fstrong><\u002Fspan>\n            <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.6;color:#4A5360\">\n              <li>A/B tests and conversion experiments on live flows.<\u002Fli>\n              <li>Usability testing with real users, synthesised into next steps.<\u002Fli>\n              <li>Visual QA so what ships matches what was designed.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"packages\" data-screen-label=\"Packages\" style=\"padding:20px 40px 120px;background:linear-gradient(180deg,rgba(169,119,11,0.06) 0%,rgba(169,119,11,0.02) 100%)\">\n      <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px\">\n        <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid rgba(169,119,11,0.2);background:#ffffff;transition:opacity .8s ease,transform .8s ease\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;padding:26px;background:linear-gradient(160deg,rgba(169,119,11,0.14) 0%,rgba(169,119,11,0.05) 100%)\">\n            <span style=\"align-self:flex-start;padding:5px 12px;border-radius:8px;background:rgba(255,255,255,0.8);font-size:12px;font-style:italic;color:#855D07\">Smallest useful scope<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Outfit',sans-serif;font-size:25px;font-weight:600;line-height:1.25;letter-spacing:-0.01em\">Focused Engagements <span style=\"font-weight:400\">(starting at ₹40k)<\u002Fspan><\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:18px;padding:26px;flex:1\">\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A5360\"><strong style=\"color:#16181D\">UX Audit<\u002Fstrong> — a heuristic and analytics review of one flow, delivered as a prioritised fix list you can act on immediately.<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A5360\"><strong style=\"color:#16181D\">Research Sprint<\u002Fstrong> — interviews or moderated sessions with your real users, synthesised into findings and a recommended direction.<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#4A5360\"><strong style=\"color:#16181D\">Design Experiment<\u002Fstrong> — one hypothesis, one variant, instrumented and shipped, with a readout on whether it moved the metric.<\u002Fp>\n            <a href=\"mailto:sindhu.bayagari@gmail.com\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:auto;padding:15px 24px;border-radius:999px;border:1px solid #16181D;color:#16181D;font-size:12px;font-weight:700;letter-spacing:0.12em;white-space:nowrap\" style-hover=\"background:#16181D;color:#ffffff\">TALK IT THROUGH\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" olumn;gap:6px\">\n            <span style=\"font-family:'Outfit',sans-serif;font-size:19px;font-weight:600\">Earlier Company<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:18px;font-size:13px;color:#4A5360\">\n              <span>UI Designer<\u002Fspan>\n              <span style=\"letter-spacing:0.1em;color:#6A7480\">2019 – 2021<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <span style=\"padding:6px 14px;border:1px solid #EFDCA6;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:0.1em;white-space:nowrap;color:#A9770B\">DESIGN SYSTEM<\u002Fspan>\n            <span style=\"padding:6px 14px;border:1px solid #EFDCA6;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:0.1em;white-space:nowrap;color:#A9770B\">B2B<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 28px;border-radius:16px;background:#ffffff;box-shadow:0 2px 14px rgba(16,24,32,0.07);transition:opacity .7s ease,transform .7s ease\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Outfit',sans-serif;font-size:19px;font-weight:600\">First Company<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:18px;font-size:13px;color:#4A5360\">\n              <span>Visual Designer<\u002Fspan>\n              <span style=\"letter-spacing:0.1em;color:#6A7480\">2018 – 2019<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <span style=\"padding:6px 14px;border:1px solid #EFDCA6;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:0.1em;white-space:nowrap;color:#A9770B\">MARKETING<\u002Fspan>\n            <span style=\"padding:6px 14px;border:1px solid #EFDCA6;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:0.1em;white-space:nowrap;color:#A9770B\">BRANDING<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display:flex;justify-content:center;margin-top:54px;transition:opacity .7s ease,transform .7s ease\">\n        <a href=\"#0\" style=\"display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;border:1px solid #16181D;color:#16181D;font-size:12px;font-weight:700;letter-spacing:0.12em;white-space:nowrap\" style-hover=\"background:#16181D;color:#ffffff\">DOWNLOAD RESUME\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12h13M13 6l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"border-radius:44px 44px 0 0;background:#A9770B;color:#ffffff;padding:58px 48px 30px\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n      <span style=\"font-family:'Outfit',sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.01em\">Sindhu Bayagari<\u002Fspan>\n      <span style=\"font-size:11px;letter-spacing:0.16em;color:rgba(255,255,255,0.82)\">PRODUCT DESIGNER (UX &amp; UI)<\u002Fspan>\n      <nav style=\"display:flex;gap:36px;margin-top:22px;font-size:14px\">\n        <span sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;color:#ffffff\">Home<\u002Fspan>\n        <span sc-camel-on-click=\"{{ goCases }}\" style=\"cursor:pointer;color:#ffffff\">Case Studies<\u002Fspan>\n        <span sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor:pointer;color:#ffffff\">About<\u002Fspan>\n        <span sc-camel-on-click=\"{{ goServices }}\" style=\"cursor:pointer;color:#ffffff\">Services<\u002Fspan>\n        <span sc-camel-on-click=\"{{ goResume }}\" style=\"cursor:pointer;color:#ffffff\">Resume<\u002Fspan>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:rgba(255,255,255,0.28);margin:34px 0 0\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding-top:22px;font-size:13px;color:rgba(255,255,255,0.9)\">\n      <span>© 2026 – Sindhu Bayagari<\u002Fspan>\n      <div style=\"display:flex;gap:20px\">\n        <a href=\"mailto:sindhu.bayagari@gmail.com\" style=\"color:#ffffff\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Frect><path d=\"M3 7l9 6 9-6\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#0\" style=\"color:#ffffff\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Frect><path d=\"M7 10v7M7 7v.5M11 17v-4a2 2 0 014 0v4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headlineRotateMs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4200,&quot;min&quot;:1500,&quot;max&quot;:9000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;revealOnScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', openFaq: { home: null, services: null } };\n\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n    this.headlineRef = React.createRef();\n    this.phrases = [\n      'I am a product designer',\n      'I turn complex problems into beautiful, user-friendly solutions',\n      'I have a meticulous eye for detail'\n    ];\n    this.phraseIndex = 0;\n\n    this.homeFaqData = [\n      ['How do you balance user experience with business metrics?', \"I treat them as the same problem. I start from the business outcome we're trying to move, then find the point in the experience where user friction is costing us that outcome. Fixing the friction usually moves the metric — and when the two genuinely conflict, I make the trade-off explicit so the team decides with open eyes rather than by accident.\"],\n      ['Do you approach design from a growth perspective?', \"Yes. I look for the smallest change that can be shipped and measured, instead of a redesign that takes a quarter to validate. That means lightweight A/B tests, instrumented flows, and a clear hypothesis before anything goes into Figma.\"],\n      ['Can you work on projects beyond growth-focused design?', 'Yes — growth work is where I am measured, not the boundary of what I do. Onboarding flows, design systems, internal tooling, and brand-adjacent surfaces are all familiar territory. The method travels better than the category: find the real problem, design the smallest useful answer, then check whether it worked.'],\n      ['How does responsive web design translate to mobile app design?', \"The layout thinking carries over; the interaction model doesn't. On the web I'm designing for a resizable canvas and a cursor. In an app I'm designing for platform conventions, gestures, offline states, and a thumb. I design for the platform rather than scaling one canvas down to the other.\"]\n    ];\n\n    this.serviceFaqData = [\n      ['How do I know which service is right for me?', \"If you know something is wrong but not what, start with an audit or research. If you already know what's broken, go straight to a redesign package. If you need a designer in the room week to week, a retainer is the better fit. A discovery call sorts this out in twenty minutes.\"],\n      ['How does payment work?', 'Fixed-scope projects are split into a deposit to book the work and a balance on delivery. Retainers are billed monthly, and hourly support is invoiced against tracked time.'],\n      ['I have a limited budget — can I still work with you?', \"Often, yes. Tell me the budget up front and I'll tell you honestly what can be done well inside it. I'd rather scope down to something that genuinely helps than stretch a small budget across work that ends up thin.\"],\n      [\"Why does UX cost this much? Can't I get it cheaper elsewhere?\", \"You can, and it usually costs more later. Cheap work tends to produce quick visuals with no strategy or usability thinking, which leads to a costly redesign; agencies bring big teams and the overhead to match. I sit in between: flexible, strategic, and scoped to fit real business needs, so every rupee spent is tied to a measurable outcome.\"],\n      [\"What's the timeline for a typical project?\", 'An audit takes about a week. Research studies run two to three weeks. A full redesign is typically six to ten weeks depending on scope and how much testing we build in.'],\n      ['Do you do branding or coding?', \"Not as a core service. I can build on and extend an existing brand, and I write enough HTML and CSS to hand off cleanly and QA what ships — but full identity work or production engineering is better placed with a specialist.\"],\n      ['Do you use AI in your workflow?', \"Yes, as an assistant rather than a replacement. I use it to accelerate my workflow, organise ideas, and refine what I already know — never to outsource the creative or strategic decisions.\"],\n      ['How involved do I need to be in the process?', \"Less than you'd expect, but not zero. I need a kickoff, access to whoever knows the users and the data, and a short review at each milestone. Everything else I drive.\"]\n    ];\n  }\n\n  componentDidMount() {\n    this.startHeadline();\n    this.setupScroll();\n  }\n\n  componentDidUpdate() {\n    this.setupScroll();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    if (this.io) this.io.disconnect();\n    if (this.countIo) this.countIo.disconnect();\n  }\n\n  startHeadline() {\n    const ms = this.props.headlineRotateMs ?? 4200;\n    clearInterval(this.timer);\n    const el0 = this.headlineRef.current;\n    // Rotation is an enhancement: with a frozen timeline the fade's inline\n    // opacity:0 would be what a serializing capture renders.\n    if (!(document.timeline && document.timeline.currentTime > 0)) {\n      if (el0) el0.style.opacity = '1';\n      return;\n    }\n    this.timer = setInterval(() => {\n      const el = this.headlineRef.current;\n      if (!el) return;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(-10px)';\n      setTimeout(() => {\n        this.phraseIndex = (this.phraseIndex + 1) % this.phrases.length;\n        el.textContent = this.phrases[this.phraseIndex];\n        el.style.transform = 'translateY(10px)';\n        setTimeout(() => {\n          el.style.opacity = '1';\n          el.style.transform = 'translateY(0)';\n        }, 30);\n      }, 480);\n    }, ms);\n  }\n\n  // Replays the count-up every time the number scrolls back into view.\n  watchCount(el) {\n    if (el.dataset.watching) return;\n    el.dataset.watching = '1';\n    if (!(document.timeline && document.timeline.currentTime > 0)) return;\n    if (!this.countIo) {\n      this.countIo = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) {\n            if (!e.target.dataset.running) this.animateCount(e.target);\n          } else {\n            delete e.target.dataset.running;\n          }\n        });\n      }, { threshold: 0.6 });\n    }\n    this.countIo.observe(el);\n  }\n\n  animateCount(el) {\n    el.dataset.running = '1';\n    const target = parseFloat(el.getAttribute('data-count'));\n    if (isNaN(target)) return;\n    const decimals = parseInt(el.getAttribute('data-decimals') || '0', 10);\n    const prefix = el.getAttribute('data-prefix') || '';\n    const suffix = el.getAttribute('data-suffix') || '';\n    const dur = 1900;\n    const t0 = Date.now();\n    const fmt = (v) => prefix + v.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;\n    const tick = setInterval(() => {\n      const p = Math.min(1, (Date.now() - t0) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = fmt(target * eased);\n      if (p >= 1) { clearInterval(tick); el.textContent = fmt(target); }\n    }, 32);\n    setTimeout(() => { clearInterval(tick); el.textContent = fmt(target); }, dur + 400);\n  }\n\n  setupScroll() {\n    const root = this.rootRef.current;\n    if (!root) return;\n    const enabled = this.props.revealOnScroll ?? true;\n    const show = (el) => {\n      el.dataset.revealed = '1';\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n      el.querySelectorAll('[data-count]').forEach((c) => this.watchCount(c));\n    };\n    const items = Array.prototype.slice.call(root.querySelectorAll('[data-reveal]'));\n    // Animation is an enhancement: only hide things when the document timeline is\n    // actually running (a frozen/hidden render context would leave them stuck at 0).\n    const live = !!(document.timeline && document.timeline.currentTime > 0);\n    if (!enabled || !live) { items.forEach(show); return; }\n    if (this.io) this.io.disconnect();\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          const el = e.target;\n          const delay = Math.min(260, (Array.prototype.indexOf.call(el.parentNode.children, el) % 3) * 90);\n          setTimeout(() => show(el), delay);\n          this.io.unobserve(el);\n        }\n      });\n    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });\n    items.forEach((el) => {\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.92) { show(el); return; }\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(30px)';\n      this.io.observe(el);\n    });\n    clearTimeout(this.failsafe);\n    this.failsafe = setTimeout(() => items.forEach(show), 6000);\n  }\n\n  scrollTo(y) {\n    try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, y); }\n  }\n\n  go(page, then) {\n    if (this.state.page === page) { if (then) then(); return; }\n    this.setState({ page }, () => {\n      window.scrollTo(0, 0);\n      requestAnimationFrame(() => { if (then) then(); });\n    });\n  }\n\n  buildFaqs(group, data) {\n    const open = this.state.openFaq[group];\n    return data.map((row, i) => ({\n      q: row[0],\n      a: row[1],\n      open: open === i,\n      caret: open === i ? 'rotate(180deg)' : 'rotate(0deg)',\n      toggle: () => this.setState((s) => ({\n        openFaq: Object.assign({}, s.openFaq, { [group]: s.openFaq[group] === i ? null : i })\n      }))\n    }));\n  }\n\n  renderVals() {\n    return {\n      rootRef: this.rootRef,\n      headlineRef: this.headlineRef,\n      isHome: this.state.page === 'home',\n      isAbout: this.state.page === 'about',\n      isServices: this.state.page === 'services',\n      homeFaqs: this.buildFaqs('home', this.homeFaqData),\n      serviceFaqs: this.buildFaqs('services', this.serviceFaqData),\n      goServices: () => this.go('services'),\n      goPackages: () => this.go('services', () => {\n        const el = document.getElementById('packages');\n        if (el) this.scrollTo(el.getBoundingClientRect().top + window.scrollY - 80);\n      }),\n      goHome: () => this.go('home', () => this.scrollTo(0)),\n      goAbout: () => this.go('about'),\n      goCases: () => this.go('home', () => {\n        const el = document.getElementById('case-studies');\n        if (el) this.scrollTo(el.getBoundingClientRect().top + window.scrollY - 80);\n      }),\n      goResume: () => this.go('about', () => {\n        const root = this.rootRef.current;\n        const el = root && root.querySelector('[data-screen-label=\"Work experience\"]');\n        if (el) this.scrollTo(el.getBoundingClientRect().top + window.scrollY - 80);\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
